name: update-data
on:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - name: Actualizar datos
        # Un conector caído (p. ej. Eurostat) no debe impedir guardar los datasets correctos; el informe lista los errores.
        continue-on-error: true
        run: python -m src.pipelines.update_all
      - name: Tests de datos
        run: python -m pytest -q tests/test_data_*.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-report
          path: artifacts/data_quality/update_report_*
      - name: Commit en datos/auto-update (nunca a main, sin force push)
        run: |
          if [ -z "$(git status --porcelain data/processed data/metadata data/raw data/staging artifacts/data_quality)" ]; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B datos/auto-update
          git add data/processed data/metadata data/raw data/staging artifacts/data_quality
          git commit -m "datos: actualización automática $(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin datos/auto-update >/dev/null 2>&1; then
            git fetch origin datos/auto-update
            git merge -X ours --no-edit origin/datos/auto-update
          fi
          git push origin datos/auto-update
