<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Portal Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 2.6rem 2.2rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: #1a1a2e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.4rem;
        }

        .card-icon svg {
            color: #fff;
            fill: #fff;
            width: 26px;
            height: 26px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 0.84rem;
            color: #888;
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            padding: 0.62rem 0.9rem;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1a1a2e;
            transition: border-color 0.2s;
            margin-bottom: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #1a1a2e;
        }

        .btn {
            width: 100%;
            padding: 0.72rem;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.97rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.2rem;
        }

        .btn:hover {
            background: #2d2d50;
        }

        .error {
            background: #fff5f5;
            border: 1px solid #f5c6cb;
            color: #c0392b;
            border-radius: 6px;
            padding: 0.55rem 0.85rem;
            font-size: 0.84rem;
            margin-bottom: 1rem;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #bbb;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2a5 5 0 1 0 0 10A5 5 0 0 0 12 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z" />
            </svg>
        </div>
        <h1>Portal de Analisis</h1>
        <p class="subtitle">Introduce tus credenciales para acceder.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username" placeholder="usuario" autocomplete="username" required>
            <label for="password">Contrasena</label>
            <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password"
                required>
            <button type="submit" class="btn">Iniciar sesion</button>
        </form>

        <p class="footer">Acceso restringido &middot; Solo personal autorizado</p>
    </div>
</body>

</html>
