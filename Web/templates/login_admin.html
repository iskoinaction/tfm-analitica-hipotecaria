<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | CaixaBank Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.login-body {
            min-height: 100vh;
            background: linear-gradient(135deg, #003366 0%, #005fa3 60%, #0072c6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', sans-serif;
        }

        .login-card {
            background: #fff;
            border-radius: 14px;
            padding: 2.8rem 2.5rem 2.2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
            text-align: center;
        }

        .login-logo {
            margin-bottom: 1.4rem;
        }

        .login-logo img {
            height: 38px;
        }

        .login-card h2 {
            font-size: 1.15rem;
            color: #003366;
            margin: 0 0 0.3rem 0;
            font-weight: 700;
        }

        .subtitle {
            color: #888;
            font-size: 0.84rem;
            margin-bottom: 1.8rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.83rem;
            color: #444;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.65rem 0.95rem;
            border: 1.5px solid #ccc;
            border-radius: 7px;
            font-size: 0.97rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0072c6;
        }

        .btn-primary {
            width: 100%;
            background: #0072c6;
            color: #fff;
            border: none;
            padding: 0.78rem;
            border-radius: 7px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #005fa3;
        }

        .error-msg {
            background: #fff5f5;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            color: #c0392b;
            font-size: 0.86rem;
            padding: 0.6rem 0.9rem;
            margin-bottom: 1rem;
            text-align: left;
        }

        .login-footer {
            margin-top: 1.4rem;
            font-size: 0.76rem;
            color: #aaa;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.82rem;
            color: #0072c6;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <img src="https://www.caixabank.es/deployedfiles/common/R2016/Estaticos/images/gif/logo_laCaixa_principal.gif"
                alt="CaixaBank">
        </div>
        <h2>Panel de Administracion</h2>
        <p class="subtitle">Acceso restringido al area de gestion. Introduce tus credenciales de administrador.</p>

        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" name="username" id="username" placeholder="Administrador" autocomplete="username"
                    required>
            </div>
            <div class="input-group">
                <label for="password">Contrasena</label>
                <input type="password" name="password" id="password" placeholder="••••••••"
                    autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-primary">Acceder al panel</button>
        </form>

        <a href="/" class="back-link">Volver al portal</a>
        <p class="login-footer">Panel de administracion interno &middot; TFM 2026</p>
    </div>
</body>

</html>
